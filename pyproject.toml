[project]
name="atlogger"
version = "0.2.3"
authors = [
  { name="Guilherme Toledo", email="toledo@guilherme.zip" },
]
description = "Python decorator to log artifacts with mlflow, wandb"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "CC0-1.0"
license-files = ["LICEN[CS]E*"]

dependencies = []

[project.urls]
Repository = "https://github.com/drawnator/Atlogger"

[project.optional-dependencies]
wandb = [
    "wandb"
]
mlflow = [
    "mlflow"
]
[project.urls]
Homepage = "https://github.com/drawnator/atlog"

[project.scripts]
atlogger = "atlogger:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.70.1",
]
